[package]
name = "work-escrow"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[target.'cfg(target_arch = "wasm32")'.dependencies]
near-sdk = { version = "=5.30.0", features = ["legacy"] }
dcap-qvl = { version = "=0.5.2", default-features = false, features = ["std", "rustcrypto", "default-x509"] }
getrandom = { version = "0.2", features = ["custom"] }
p256 = { version = "=0.13.2", features = ["ecdsa"] }
rustls-pki-types = "=1.15.1"

[profile.release]
codegen-units = 1
opt-level = 3
lto = true
panic = "abort"
overflow-checks = true
